acceptance_design_frozen_before_runs:
  minimum_independent_sources: 6
  minimum_venue_groups: 2
  minimum_device_groups: 2
  minimum_end_to_end_successes: 4
  success_profile: configs/production.yaml; configs/fast-motion-retry.yaml only after overlap-limited rejection
  comparison_profile: configs/fast-motion-benchmark.yaml with both candidates always enabled
  failure_rule: no NHT or export may be published after all-candidate rejection
