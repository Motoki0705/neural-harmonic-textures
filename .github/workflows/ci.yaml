name: Pipeline CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, type, test, schema, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install CPU pipeline and test dependencies
        run: uv sync --extra test

      - name: Ruff
        run: uv run --extra test ruff check nht_pipeline tests scripts

      - name: Mypy
        run: uv run --extra test mypy nht_pipeline

      - name: Unit and real pycolmap integration tests
        run: uv run --extra test pytest -q

      - name: Validate JSON Schema definitions
        run: uvx check-jsonschema --check-metaschema schemas/*.schema.json

      - name: Build wheel and source distribution
        run: uv build
