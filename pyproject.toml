# Video-to-NHT reconstruction pipeline plus optional AOV helpers.

[build-system]
requires = ["setuptools>64,<80"]
build-backend = "setuptools.build_meta"

[project]
name = "nht"
version = "0.0.0"
description = "Mutable video-to-SfM-to-NHT reconstruction pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "Pillow>=10",
    "pycolmap>=4,<5",
    "PyYAML>=6",
]

[project.optional-dependencies]
test = ["jsonschema>=4.25", "mypy>=1.17", "pytest>=8", "ruff>=0.12"]
aov = ["torch>=2.4", "torchvision>=0.19"]
sfm-learned = [
    "hloc @ git+https://github.com/cvg/Hierarchical-Localization.git",
]

[project.scripts]
nht-reconstruct = "nht_pipeline.__main__:main"
nht-render = "nht_pipeline.render:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aov*", "nht_pipeline*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint.per-file-ignores]
"tests/test_nht_aov.py" = ["BLE001", "F401", "I001", "RUF012", "RUF059", "UP035"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires an external NHT CUDA runtime and real SfM workspace"]

[tool.mypy]
python_version = "3.11"
packages = ["nht_pipeline"]
ignore_missing_imports = true
no_site_packages = true
check_untyped_defs = true
warn_unused_ignores = true
